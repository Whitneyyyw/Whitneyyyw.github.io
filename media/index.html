/* ---------- 照片画廊 ---------- */
.card-photos{margin-top:1.05rem}

.photos-single{text-align:center}
.photo-single{display:block;max-width:100%;max-height:420px;margin:0 auto;border-radius:12px;object-fit:contain;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;box-shadow:0 2px 14px rgba(0,0,0,.1);background:var(--background-color-grey-light-1)}
.photo-single:hover{transform:scale(1.02);box-shadow:var(--meow-box-shadow)}

/* ---------- 链接区 ---------- */
.card-links{margin-top:1.05rem;display:flex;gap:.5rem;flex-wrap:wrap}
.link-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .85rem;border:1px solid var(--card-border-color);border-radius:18px;background:var(--background-color-grey-light-1);color:var(--font-color);font-size:.8rem;font-weight:600;text-decoration:none;transition:all .25s ease}
.link-btn:hover{background:var(--theme-color);color:var(--font-color-invert);border-color:var(--theme-color)}
.link-btn .link-arrow{font-size:.75rem;opacity:.7}

/* ---------- 灯箱 ---------- */
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:none;justify-content:center;align-items:center;cursor:zoom-out}
.lightbox.show{display:flex!important}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);animation:lbZoom .3s ease;cursor:default}
.lightbox-close{position:absolute;top:1.2rem;right:1.5rem;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:1.4rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;transition:background .2s ease;z-index:10;line-height:1}
.lightbox-close:hover{background:rgba(255,255,255,.3)}
/* 灯箱打开时锁住页面滚动 */
body.lb-open{overflow:hidden;touch-action:none}
@keyframes lbZoom{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- 空态 ---------- */
.media-empty{text-align:center;color:var(--font-color-light-2);padding:3rem 0;font-size:.95rem}

/* ---------- 暗色模式 ---------- */
body[data-mode='dark'] .tag-movie{background:#6c5ce733;color:#c4b5e8}
body[data-mode='dark'] .tag-music{background:#e87a9033;color:#f4a7b9}
body[data-mode='dark'] .tag-drama{background:#d4894a33;color:#f0c898}
body[data-mode='dark'] .lightbox{background:rgba(0,0,0,.94)}

/* ---------- 响应式 ---------- */
@media (max-width:640px){
  .timeline{padding-left:30px}
  .timeline::before{left:15px}
  .timeline-dot{left:-20px;width:11px;height:11px;top:18px}
  .card-top{flex-direction:column;gap:.9rem}
  .media-card{padding:1.2rem}
  .photo-thumb{width:110px;height:80px}
  .photos-single .photo-single{max-height:240px}
  .media-stats{gap:.6rem}
  .stat-item{padding:.65rem .9rem;min-width:66px}
}
/* ---------- 评论区 ---------- */
.media-comment{max-width:720px;margin:2.5rem auto 0;padding:0 1rem}
</style>

  <!-- 页面描述 -->
  <p class="media-desc">用生活所感去读书，用读书所得去生活</p>

  <div class="media-stats" id="mediaStats"></div>

  <!-- 筛选 -->
  <div class="media-filters" id="mediaFilters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="book">📖</button>
    <button class="filter-btn" data-filter="movie">🎬</button>
    <button class="filter-btn" data-filter="music">🎵</button>
    <button class="filter-btn" data-filter="drama">📺</button>
  </div>

  <!-- 时间线（JS 渲染）-->
  <div class="timeline" id="mediaTimeline"></div>

  <!-- 灯箱 -->
  <div class="lightbox" id="mediaLightbox">

  </div>

<script src="/media/media-data.js"></script>
<script>
/* ---------- 类型配置 ---------- */
const TYPE_CONFIG = {
  book:  { label:'书籍',   tagClass:'tag-book',  gradient:'linear-gradient(145deg,#a8d0f0,#4a90b8)', emoji:'📖' },
  movie: { label:'电影',   tagClass:'tag-movie', gradient:'linear-gradient(145deg,#c4b5e8,#6c5ce7)', emoji:'🎬' },
  music: { label:'音乐',   tagClass:'tag-music', gradient:'linear-gradient(145deg,#f4a7b9,#e87a90)', emoji:'🎵' },
  drama: { label:'电视剧', tagClass:'tag-drama', gradient:'linear-gradient(145deg,#f5c898,#d4894a)', emoji:'📺' }
};

/* ---------- 工具函数 ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stars(r){var f=Math.round(Number(r)||0);return '★'.repeat(f)+'☆'.repeat(5-f);}
function fmtDate(d){var x=new Date(d.replace(/-/g,'/'));return x.getFullYear()+'年'+(x.getMonth()+1)+'月'+x.getDate()+'日';}
// 换行支持：先转义再 \n → <br>
function fmtText(s){return esc(String(s||'')).replace(/\n/g,'<br>');}

/* ---------- 统计 ---------- */
function renderStats(){
  var types=['book','movie','music','drama'];
  var counts={};types.forEach(function(t){counts[t]=0;});
  MEDIA_DATA.forEach(function(r){if(typeof counts[r.type]==='number')counts[r.type]++;});
  var items=[
    {emoji:'📖',num:counts.book,label:'书籍'},
    {emoji:'🎬',num:counts.movie,label:'电影'},
    {emoji:'🎵',num:counts.music,label:'音乐'},
    {emoji:'📺',num:counts.drama,label:'电视剧'}
  ];
  document.getElementById('mediaStats').innerHTML=items.map(function(i){
    return '<div class="stat-item"><div class="stat-emoji">'+i.emoji+'</div><div class="stat-number">'+i.num+'</div><div class="stat-label">'+i.label+'</div></div>';
  }).join('');
}

/* ---------- 照片画廊 HTML ---------- */
function renderPhotos(photos){
  if(!photos||!photos.length)return'';
  // 单张：大图居中
  if(photos.length===1){
    return '<div class="card-photos photos-single"><img  class="photo-single"  lazyload src="/assets/images/Meow-Loading.webp" data-lazy-src="'+esc(photos[0])+'"  alt="照片" data-lightbox="'+esc(photos[0])+'" onclick="openLightbox(this)" loading="lazy"></div>';
  }
  // 多张：横向滚动画廊
  var imgs=photos.map(function(src,i){
    return '<img  class="photo-thumb"  lazyload src="/assets/images/Meow-Loading.webp" data-lazy-src="'+esc(src)+'"  alt="照片 '+(i+1)+'" data-lightbox="'+esc(src)+'" onclick="openLightbox(this)" loading="lazy">';
  }).join('');
  return '<div class="card-photos"><div class="photos-gallery">'+imgs+'</div></div>';
}

/* ---------- 链接区 HTML ---------- */
function renderLinks(links){
  if(!links||!links.length)return'';
  var btns=links.map(function(l){
    return '<a class="link-btn" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'<span class="link-arrow">→</span></a>';
  }).join('');
  return '<div class="card-links">'+btns+'</div>';
}

/* ---------- 标签区 HTML ---------- */
function renderTags(tags){
  if(!tags||!tags.length)return'';
  var chips=tags.map(function(t){return '<span class="custom-tag">#'+esc(t)+'</span>';}).join('');
  return '<div class="card-tags">'+chips+'</div>';
}

/* ---------- 渲染单条卡片 ---------- */
function renderCard(r){
  var cfg=TYPE_CONFIG[r.type]||TYPE_CONFIG.book;
  var parts=[];

  // 基本信息
  parts.push('<div class="card-top">');
  parts.push('<div class="card-info">');
  parts.push('<div class="card-title-row"><span class="card-title">'+esc(r.title)+'</span><span class="tag '+cfg.tagClass+'">'+cfg.emoji+'</span><span class="rating"><span class="stars">'+stars(r.rating)+'</span><span class="rating-num">'+Number(r.rating).toFixed(1)+'</span></span></div>');
  parts.push('<div class="card-author">'+esc(r.author||'')+'</div>');
  parts.push(renderTags(r.tags));
  parts.push('</div></div>');

  // 正文区
  var bodyParts=[];
  if(r.intro)  bodyParts.push('<div class="card-section"><div class="section-heading">作品简介</div><div class="section-text">'+fmtText(r.intro)+'</div></div>');
  if(r.thought)bodyParts.push('<div class="card-section"><div class="section-heading">感悟</div><div class="section-text">'+fmtText(r.thought)+'</div></div>');
  if(r.quote){
    var qs=Array.isArray(r.quote)?r.quote:[r.quote];
    var quoteHtml=qs.map(function(q){return '<div class="section-text quote">'+fmtText(q)+'</div>';}).join('');
    bodyParts.push('<div class="card-section"><div class="section-heading">摘录</div>'+quoteHtml+'</div>');
  }
  if(bodyParts.length)parts.push('<div class="card-body">'+bodyParts.join('')+'</div>');

  // 照片 + 链接
  parts.push(renderPhotos(r.photos));
  parts.push(renderLinks(r.links));

  return parts.join('');
}

/* ---------- 渲染时间线 ---------- */
function renderCards(filter){
  var list=filter==='all'?MEDIA_DATA:MEDIA_DATA.filter(function(r){return r.type===filter;});
  var sorted=list.slice().sort(function(a,b){return new Date(b.date.replace(/-/g,'/'))-new Date(a.date.replace(/-/g,'/'));});
  var wrap=document.getElementById('mediaTimeline');
  if(!sorted.length){wrap.innerHTML='<div class="media-empty">这里还空空如也～</div>';return;}
  wrap.innerHTML=sorted.map(function(r){
    return '<div class="timeline-item" data-type="'+r.type+'">'
      +'<div class="timeline-dot"></div>'
      +'<div class="timeline-date">'+fmtDate(r.date)+'</div>'
      +'<div class="media-card">'+renderCard(r)+'</div>'
      +'</div>';
  }).join('');
}

/* ---------- 灯箱 ---------- */
(function(){
  var lb=document.getElementById('mediaLightbox');
  var lbImg=document.getElementById('lightboxImg');
  var closeBtn=lb.querySelector('.lightbox-close');
  window.openLightbox=function(el){
    var src=el.getAttribute('data-lightbox');
    if(!src)return;
    lbImg.src=src;
    lb.classList.add('show');
    document.body.classList.add('lb-open');
  };
  function hide(){
    if(!lb.classList.contains('show'))return;
    lb.classList.remove('show');
    document.body.classList.remove('lb-open');
  }
  closeBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();hide();});
  lb.addEventListener('click',function(e){if(e.target===lb)hide();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
})();

/* ---------- 筛选 ---------- */
(function(){
  var btns=document.querySelectorAll('#mediaFilters .filter-btn');
  btns.forEach(function(btn){
    btn.addEventListener('click',function(){
      btns.forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      renderCards(btn.dataset.filter);
    });
  });
})();

/* ---------- 启动 ---------- */
renderStats();
renderCards('all');
</script>
